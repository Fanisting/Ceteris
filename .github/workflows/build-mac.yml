# Builds the Mac app, which cannot be built on Windows, and proves it runs before keeping it.
# Start it from the Actions tab, or with: gh workflow run build-mac.yml
name: Build macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The full suite also covers Windows paths and WSL, which only hold on Windows.
      - name: Mac unit tests
        run: npx vitest run src/main/platform/macos.test.ts src/main/platform/index.test.ts

      - name: Build
        run: |
          npx electron-vite build
          npx electron-builder --mac dmg --arm64 --x64 --publish never --config electron-builder.yml -c.directories.output=release/mac

      - name: Check the signature
        run: codesign --verify --deep --strict --verbose=2 release/mac/mac-arm64/Ceteris.app

      - name: Run the app
        run: node --experimental-websocket scripts/smoke-mac.mjs release/mac/mac-arm64/Ceteris.app

      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-screenshot
          path: ${{ runner.temp }}/ceteris-smoke.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: ceteris-macos
          path: release/mac/*.dmg
          retention-days: 30
