# electron-builder 配置:与稳定版并行运行的测试版
#
# 与 electron-builder.yml 的两点差异,都是为了让这个包能在**没有离线构建
# 产物**的机器上直接打出来:
#
# 1. 只出 portable,不出 NSIS 安装器。
#    portable 形态下 index.ts 会 app.setName('Ceteris (portable)'),于是它拿到
#    独立的 %APPDATA%\Ceteris (portable)\ 数据目录与独立的单实例锁,可以与已
#    安装的正式版 Ceteris 同时运行、互不干扰。测试远程功能时这一点是必需的。
#
# 2. extraResources 去掉 Win11 新右键菜单的三件套(MSIX / 证书 / install.ps1)。
#    那些文件由 native/context-menu/scripts/build.ps1 离线生成(需要 Rust +
#    Windows SDK),仓库里不入库。它们只服务于 Explorer 右键集成,与 Ceteris
#    Link 完全无关;缺失时主配置会让打包直接失败,所以这里剥掉。
#    代价:本包内 "设置 → 系统集成" 的 Win11 新菜单开关不可用(会报缺资源)。
#
# 用法:npm run build:beta,产物在 release/beta/<version>/win-unpacked,版本号由
# scripts/build-channel.mjs 生成。它用 --win dir 打包,不走下面的 portable target:单文件
# 便携版第二次启动时会删掉运行中程序的文件。
# Link 端口和 tmux socket 的隔离在 src/shared/channel.ts。
#
# Isolation from the installed Ceteris: appId, productName and executableName all
# differ on purpose. Do not change them back.
# - executableName: Windows tools match processes by image name. The NSIS installer
#   and uninstaller run `taskkill /f /im Ceteris.exe`, which hits every Ceteris.exe the
#   user owns regardless of its path. CeterisBeta.exe is out of reach of that.
#   build-type.ts keys beta detection on this name, so keep the two in sync.
# - productName / appId: separate taskbar group, tray entry and login item.
# - Data dir and single-instance lock: %APPDATA%\Ceteris Beta, set in index.ts.
# Never add an nsis target here: a beta installer would close the installed Ceteris.
#
# 这个文件是测试构建脚手架,不进 release 流程;正式发布仍走 electron-builder.yml。

appId: com.fanisting.ceteris.beta
productName: Ceteris Beta
executableName: CeterisBeta
copyright: Copyright (c) 2026 Liyue-Cheng, Fanisting

directories:
  output: release/${version}
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/*.d.ts'
  - '!**/node_modules/.bin'

# Same size trims as electron-builder.yml; see the notes there.
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW

asar: true
asarUnpack:
  - node_modules/node-pty/**

# shell hook 脚本必须留在 asar 之外:pwsh.exe / bash.exe 是外部进程,
# 读不了 asar 虚拟文件系统。
extraResources:
  - from: src/shell-hooks
    to: shell-hooks
  # 公式图片扩展 (ADR-019):latex-math 插件和它的本地 marketplace。Claude Code 读这个
  # 目录 (`claude plugin marketplace add <install>\resources\extensions`),所以放在 asar 外。
  - from: extensions
    to: extensions
    filter:
      - "**/*"
      - "!**/tests/**"
      - "!**/tools/**"
      - "!**/.claude-plugin/types/**"
      - "!**/tsconfig.json"
      - "!**/*.d.mts"

win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  files:
    - '!node_modules/node-pty/prebuilds/{darwin-*,linux-*,win32-arm64}/**'
    - '!node_modules/node-pty/third_party/conpty/*/win10-arm64/**'

portable:
  artifactName: CeterisBeta-${version}-${arch}.${ext}
